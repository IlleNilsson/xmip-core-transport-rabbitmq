[package]
name = "xmip-core-transport-rabbitmq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-rabbitmq"
description = "RabbitMQ transport: RabbitMQ's idiom over the amqp technology's AMQP 0-9-1 — a queue is a Location, published to through the default exchange, declared durable first and every message persistent — and every delivery is one Stream. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# A target read as a URI writes it (`net::Target`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The protocol: the one AMQP 0-9-1 in the estate — frame, methods,
# content, the client and the far-end session. What is RabbitMQ's own is
# the idiom this crate speaks through it (a declared sibling dependency,
# architecture.toml). Its declaration alone where this crate is: the
# `user` and `virtual_host` both declare (`amqp::presenting`).
amqp = { workspace = true, default-features = false }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "amqp/default", "dep:context", "dep:net"]
# The declaration alone, the `amqp` technology's `user` and `virtual_host`
# among its settings.
declaration = ["amqp/declaration"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
